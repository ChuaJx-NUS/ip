plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'bigbrother.BigBrother'
}

tasks.named('shadowJar') {
    archiveFileName = 'BigBrother.jar'
}